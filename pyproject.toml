[project]
name = "local-web-research-assistant"
version = "0.1.0"
description = "An explicit Ollama tool loop using Microsoft's external Playwright MCP server"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.1.1",
    "ollama==0.6.2",
    "pydantic==2.13.5",
    "gradio==6.26.0",
    "jsonschema>=4.26,<5",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
